services:
  # ================================
  # FRONTEND - STATIC SITE (VITE)
  # ================================
  - type: static
    name: business-pos-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://business-pos-backend.onrender.com   # Cambia esto según tu backend

  # ================================
  # BACKEND - WEB SERVICE (FASTAPI / NODE)
  # ================================
  - type: web
    name: business-pos-backend
    rootDir: app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: ${business-pos-db.DATABASE_URL}
      - key: PORT
        value: 10000

# ============================================
# OPTIONAL: POSTGRES DATABASE (UNCOMMENT IF NEEDED)
# ============================================
# databases:
#   - name: business-pos-db
#     plan: free